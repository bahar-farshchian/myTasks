<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
<link  rel="stylesheet" href="mc-calendar.min.css">

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    .completed {
        text-decoration: line-through;
        opacity: 0.66;
    }

        font-family: 'Vazirmatn' , sans-serif;
    } */

</head>
<body class="bg-[url(img/unnamed.png)] bg-contain bg-repeat overflow-x-hidden">

  <!-- Header -->
  <header class="bg-taupe-600 h-[80px] flex justify-end items-center p-4">
    <div>
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search tasks..."
        class="w-full rounded-lg bg-neutral-300 border-3 border-neutral-500 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-600"
      >
    </div>
  </header>


  <!-- Main -->
  <main
    class="grid grid-cols-1 lg:grid-cols-8 min-h-screen w-full
    justify-items-center overflow-x-hidden
    lg:translate-x-12"
  >

    <!-- فرم -->
    <section
      class="order-2 lg:order-1
      col-span-1 lg:col-span-3 lg:col-start-5
      w-full
      lg:mt-6
      scale-130
      lg:scale-100
      translate-y-46
      -translate-x-12
      lg:-translate-x-0
      lg:-translate-y-0"
    >

      <!-- کانتینر تصویر و فرم -->
      <div
        class="relative
        w-[680px] sm:w-[1350px] lg:w-[900px]
        h-[500px] sm:h-[860px] lg:h-[650px]
        -translate-x-[120px] sm:-translate-x-[100px]
        -translate-y-[100px]
        lg:-translate-x-4 lg:translate-y-0"
      >

        <!-- تصویر اصلی -->
        <div
          id="d"
          class="absolute
          w-full h-full
          bg-no-repeat bg-contain bg-center
          bg-[url(img/1000099302.png)]
          "
        ></div>


        <!-- Form -->
        <form
          id="taskForm"
          class="p-4 relative z-10
          w-[38%] max-w-[440px]
          pt-[170px]
          ml-[31%]
          scale-130
          lg:scale-100
          translate-y-16
          lg:translate-y-0
          rotate-359
          flex flex-col justify-center items-center
          lg:pt-42 lg:ml-63"
        >

          <h1
            class="text-2xl sm:text-3xl
            text-neutral-600 font-bold
            text-center mb-8 mr-1"
          >
            managing task
          </h1>


          <input
            class="w-[220px] sm:w-[250px]
            p-2 mb-4
            border-2 border-[#533824]
            bg-[#ffffff]
            hover:bg-neutral-300
            placeholder:font-serif"
            type="text"
            id="title"
            placeholder="Title"
            required
          >


          <select
            id="day"
            class="w-[220px] sm:w-[250px]
            p-2 mb-4
            border-2 border-[#533824]
            bg-[#ffffff]
            hover:bg-neutral-300
            placeholder:font-serif"
            required
          >
            <option value="">Select Priority</option>
            <option value="High">🔴 High</option>
            <option value="Medium">🟡 Medium</option>
            <option value="Low">🟢 Low</option>
          </select>


          <input
            class="w-[220px] sm:w-[250px]
            p-2 mb-4
            border-2 border-[#533824]
            bg-[#ffffff]
            hover:bg-neutral-300
            placeholder:font-serif"
            type="text"
            id="time"
            placeholder="Time"
            required
          >


          <div
            class="flex flex-row
            w-[220px] sm:w-[250px]
            pl-2 p-1 mb-4
            border-2 border-[#533824]
            bg-[#ffffff]
            hover:bg-neutral-300"
          >

            <input
              class="bg-transparent w-full outline-0"
              type="text"
              id="data"
              placeholder="Date"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
              required
              readonly
            >

            <img
              src="img/weekend.png"
              class="w-8 h-8 sm:w-9 sm:h-9"
              alt="calendar"
            >

          </div>


          <input type="hidden" id="editIndex">


          <button
            class="w-[64px] h-[36px]
            bg-neutral-600 text-white
            px-4 py-2 rounded-2xl
            ml-28 sm:ml-40
            mb-10
            flex justify-center items-center pt-1.5"
            type="submit"
          >
            save
          </button>

        </form>

      </div>

    </section>



    <!-- Task List -->
    <section
      class="order-1 lg:order-none
      flex flex-col items-center lg:items-start
      w-full
      lg:h-dvh
      scale-130
      lg:scale-100
      translate-y-32
      lg:translate-y-0
      col-span-1 lg:col-span-4
      lg:col-start-1 lg:ml-15"
    >

      <!-- تصویر بالای لیست -->
      <div class="w-full flex justify-center lg:block">

        <img
          class="h-auto
          w-[95vw] max-w-[660px]
          lg:h-[140px] lg:w-[660px]
          mb-10 lg:mb-14
          mt-10 lg:mt-14
          lg:-translate-x-3 lg:ml-8"
          src="img/last.png"
          alt="image description"
        >

      </div>


      <!-- Task List -->
      <div
        id="tasksList"
        class="mt-6 lg:mt-6
        space-y-3
        scale-120
        translate-y-12
        -translate-x-3
        lg:scale-100
        lg:translate-y-0
        lg:-translate-x-0
        w-[95%] max-w-xl
        lg:translate-x-7"
      >
      </div>


      <!-- Pagination -->
      <div
        id="paginationButtons"
        class="flex justify-between
        w-[45%] sm:w-1/3
        z-10
        bg-yellow-950/10
        rounded-full
        lg:ml-50 lg:translate-x-4"
      >

        <button
          id="prevBtn"
          onclick="prevPage()"
          class="px-2 py-1"
        >

          <svg
            class="text-yellow-950/80"
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="30"
            fill="currentColor"
            viewBox="0 0 298 511.93"
          >
            <path
              fill-rule="nonzero"
              d="M285.77 441c16.24 16.17 16.32 42.46.15 58.7-16.16 16.24-42.45 16.32-58.69.16l-215-214.47c-16.24-16.16-16.32-42.45-.15-58.69L227.23 12.08c16.24-16.17 42.53-16.09 58.69.15 16.17 16.24 16.09 42.54-.15 58.7l-185.5 185.04L285.77 441z"
            />
          </svg>

        </button>


        <p
          class="text-xl mt-1.5 font-bold text-yellow-950/80"
          id="showPage"
        ></p>


        <button
          id="nextBtn"
          onclick="nextPage()"
          class="px-2 py-1"
        >

          <svg
            class="text-yellow-950/80"
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="30"
            fill="currentColor"
            viewBox="0 0 298 511.93"
          >
            <path
              fill-rule="nonzero"
              d="M70.77 499.85c-16.24 16.17-42.53 16.09-58.69-.15-16.17-16.25-16.09-42.54.15-58.7l185.5-185.03L12.23 70.93c-16.24-16.16-16.32-42.45-.15-58.7 16.16-16.24 42.45-16.32 58.69-.15l215.15 214.61c16.17 16.25 16.09 42.54-.15 58.7l-215 214.46z"
            />
          </svg>

        </button>

      </div>

    </section>

  </main>
    <div id="confetti-container" class="fixed top-0 left-0 w-screen h-screen pointer-events-none z-[9999] lg:ml-1 translate-x-1 -translate-y-64 lg:-translate-x-90 lg:-translate-y-0"></div>
    <div id="loadingSpinner" class="fixed top-0 left-0 w-full h-full flex justify-center items-center bg-white/60 z-[9999] hidden">
        <div role="status">
             <svg aria-hidden="true" class="inline w-10 h-10 text-gray-200 animate-spin dark:text-gray-600 fill-yellow-900" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
                          <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
             </svg>
             <span class="sr-only">Loading...</span>
        </div>
    </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.10.2/lottie.min.js"></script>
  <script src="mc-calendar.min.js"></script>
  <script>
    const picker = MCDatepicker.create({
    el: '#data',
    dateFormat: 'YYYY/MM/DD',
    bodyType: 'inline',
    disableWeekends: false
  });
  </script>
  <script>
     const user = localStorage.getItem("loggedInUser");
const users = JSON.parse(localStorage.getItem("users")) || {};

let currentPage = 1;
let itemsPerPage = 5;

if (!user || !users[user]) {
    alert("please login first");
    window.location.href = "login.html";
} else {
    users[user].lessons = users[user].lessons || [];
    users[user].tasks = users[user].tasks || [];

    localStorage.setItem("users", JSON.stringify(users));
}

    function getSortedtasks() {

    const tasks = users[user].tasks || [];

    return tasks
        .map((task, originalIndex) => ({
            ...task,
            originalIndex
        }))
        .sort((a, b) => new Date(a.data) - new Date(b.data));
}

    function rendertasks() {
      const container = document.getElementById("tasksList");
      container.innerHTML = "";

      const tasks = getSortedtasks();

     const filteredtasks = tasks.filter(task => {
        return task.title.toLowerCase().includes(searchValue);
    });

    const totalPages = Math.ceil(
        filteredtasks.length / itemsPerPage
    );

    if (currentPage > totalPages) {
        currentPage = totalPages || 1;
    }

    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;

    const paginatedtasks = filteredtasks.slice(start, end);

// *****
  paginatedtasks.forEach((task, index) => {
    const realIndex = task.originalIndex;

    if (task.completedAt) {
      setTimeout(() => {
        const now = new Date().getTime();
        if (now - task.completedAt >= 1 * 60 * 60 * 1000) {
          deletetask(realIndex);
        }
      }, 1000);

      setTimeout(() => {
        const checkbox = document.querySelector(`input[type=checkbox][onchange="toggleCompleted(this, ${realIndex})"]`);
        if (checkbox) checkbox.checked = true;
      }, 0);

      setTimeout(() => {
        const text = document.getElementById(`task-text-${realIndex}`);
        const box = document.getElementById(`task-box-${realIndex}`);
        if (text && box) {
          text.classList.add("completed");
          box.classList.add("completed");
        }
      }, 0);
    }

    container.innerHTML += `
      <div class="relative w-full max-w-[500px] flex flex-row items-center bottom-[70px] mx-auto lg:mx-0 lg:ml-15">
        <div class="inline-flex items-center">
          <label class="flex items-center cursor-pointer relative">
            <input defaultChecked type="checkbox" onchange="toggleCompleted(this, ${realIndex})" class="peer h-7 w-7 cursor-pointer transition-all -translate-y-1.5 appearance-none rounded-full bg-slate-100 shadow hover:shadow-md border border-slate-300 checked:bg-[#5C4033]" id="check-custom-style" />
            <span class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" stroke="currentColor" stroke-width="1">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
              </svg>
            </span>
          </label>
        </div>

        <div id="task-box-${realIndex}" class="bg-[#FEFFF4] rounded-full px-6 py-2 mb-4 ml-3 w-full h-[40px] shadow-md text-sm text-gray-800 flex flex-row justify-between items-center">
          <div>
          <p id="task-text-${realIndex}">
           <strong>${task.title}</strong>
                  (${task.day})<br>
                   ${task.data} • ${task.time}
          </p>
          </div>
          <div class="flex space-x-3 flex-row-reverse gap-4">
            <button onclick="edittask(${realIndex})" class="text-cyan-900">Edit</button>
            <button onclick="deletetaskAnimated(${realIndex})" class="text-red-500">Delete</button>
          </div>
        </div>
      </div>
    `;
  });

  updatePaginationButtons();

  document.getElementById("showPage").textContent = `${currentPage}`;
}

    function saveUsers() {
      localStorage.setItem("users", JSON.stringify(users));
    }

    function deletetask(index) {
      users[user].tasks.splice(index, 1);
      saveUsers();
      showLoadingThenRender();
    }

    function edittask(index) {
      const task = users[user].tasks[index];
      document.getElementById("title").value = task.title;
      document.getElementById("day").value = task.day;
      document.getElementById("time").value = task.time;
      document.getElementById("data").value = task.data;
      document.getElementById("editIndex").value = index;
    }

    const form = document.getElementById("taskForm")
    const calendarEl = document.getElementById("calendar")
    const toggleCalendar = document.getElementById("toggleCalendar");

    document.getElementById("taskForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const title = document.getElementById("title").value;
      const day = document.getElementById("day").value;
      const time = document.getElementById("time").value;
      const data = document.getElementById("data").value;
      const index = document.getElementById("editIndex").value;

      if (index === "") {
        users[user].tasks.push({ title, day, time, data });
        saveUsers();
        currentPage = Math.ceil(users[user].tasks.length / itemsPerPage);
        // addtaskAnimated({ title, day, time, data })
        showLoadingThenRender();
      }
      else {
        users[user].tasks[index] = { title, day, time, data };
        document.getElementById("editIndex").value = "";
        saveUsers();
        showLoadingThenRender();
      }

      form.reset();
    });

showLoadingThenRender();

function addtaskAnimated(task) {
  const container = document.getElementById("tasksList");
  const index = users[user].tasks.length - 1; // آخرین درس

  const div = document.createElement("div");
  div.className = "relative w-[500px] flex flex-row-reverse items-center bottom-[70px] ml-15 opacity-0 translate-y-4 transition-all duration-500";

  div.innerHTML = `
    <div class="inline-flex items-center mb-4">
      <label class="flex items-center cursor-pointer relative">
        <input type="checkbox" onchange="toggleCompleted(this, ${index})" class="peer h-7 w-7 cursor-pointer transition-all appearance-none rounded-full bg-slate-100 shadow hover:shadow-md border border-slate-300 checked:bg-[#5C4033]" />
        <span class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" stroke="currentColor" stroke-width="1">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
          </svg>
        </span>
      </label>
    </div>
    <div id="task-box-${index}" class="task-box bg-[#FEFFF4] rounded-full px-6 py-2 mb-4 mr-3 w-full h-[40px] shadow-md text-sm text-gray-800 flex flex-row-reverse justify-between items-center">
      <div>
       <p id="task-text-${realIndex}">
       <strong>${task.title}</strong>
       (${task.day})<br>
        ${task.data} • ${task.time}
       </p>
      </div>
      <div class="flex space-x-3 flex-row-reverse gap-4">
        <button onclick="edittask(${index})" class="text-cyan-900">Edit</button>
        <button onclick="deletetaskAnimated(${index})" class="text-red-500">Delete</button>
      </div>
    </div>
  `;

  container.appendChild(div);

  setTimeout(() => {
    div.classList.remove("opacity-0", "translate-y-4");
  }, 50);
}

function toggleCompleted(checkbox, index) {
    const text = document.getElementById(`task-text-${index}`);
    const box = document.getElementById(`task-box-${index}`);
    const task = users[user].tasks[index];

    if (checkbox.checked) {

        if (text) text.classList.add("completed");
        if (box) box.classList.add("completed");

        task.completedAt = new Date().getTime();
        saveUsers();

        // اجرای انیمیشن
        playConfettiAnimation();

        setTimeout(() => {
            const now = new Date().getTime();
            const updatedtask = users[user].tasks[index];

            if (
                updatedtask &&
                updatedtask.completedAt &&
                now - updatedtask.completedAt >= 1 * 60 * 60 * 1000
            ) {
                deletetask(index);
            }

        }, 1 * 60 * 60 * 1000);

    } else {

        if (text) text.classList.remove("completed");
        if (box) box.classList.remove("completed");

        delete task.completedAt;
        saveUsers();
    }
}

function deletetaskAnimated(index) {
  if (!confirm("are you sure?")) return;

  const taskElement = document.getElementById(`task-box-${index}`)?.parentElement;

  if (taskElement) {
    taskElement.classList.add("opacity-0", "translate-x-4", "transition-all", "duration-500");

    setTimeout(() => {
      users[user].tasks.splice(index, 1);
      saveUsers();

      const totalPages = Math.ceil(users[user].tasks.length / itemsPerPage);
      if (currentPage > totalPages) {
        currentPage = totalPages || 1;
      }

      rendertasks();
    }, 500);
  } else {
    // اگر المنت پیدا نشد (اشکالی پیش اومده بود)، مستقیم حذف کن
    users[user].tasks.splice(index, 1);
    saveUsers();

    const totalPages = Math.ceil(users[user].tasks.length / itemsPerPage);
    if (currentPage > totalPages) {
      currentPage = totalPages || 1;
    }

    rendertasks();
  }
}

function nextPage() {
  const totalPages = Math.ceil(users[user].tasks.length / itemsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    rendertasks();
  }
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    rendertasks();
    updatePaginationButtons();
  }
};


function updatePaginationButtons() {
  const totalPages = Math.ceil(users[user].tasks.length / itemsPerPage);

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  // فعال یا غیرفعال کردن دکمه back
  if (currentPage <= 1) {
    prevBtn.disabled = true;
    prevBtn.classList.add("opacity-50", "cursor-not-allowed");
  } else {
    prevBtn.disabled = false;
    prevBtn.classList.remove("opacity-50", "cursor-not-allowed");
  }

  // فعال یا غیرفعال کردن دکمه next
  if (currentPage >= totalPages) {
    nextBtn.disabled = true;
    nextBtn.classList.add("opacity-50", "cursor-not-allowed");
  } else {
    nextBtn.disabled = false;
    nextBtn.classList.remove("opacity-50", "cursor-not-allowed");
  }
}

function playConfettiAnimation() {
  const container = document.getElementById('confetti-container');
  container.innerHTML = ''; // هر بار پاکش کن تا از نو پخش بشه

  lottie.loadAnimation({
    container: container,
    renderer: 'svg',
    loop: false,
    autoplay: true,
    path: 'Animation - 1748522491321.json'
  });
}

function showLoadingThenRender() {
  const spinner = document.getElementById("loadingSpinner");
  spinner.classList.remove("hidden");

  setTimeout(() => {
    rendertasks();
    spinner.classList.add("hidden");
  }, 600); // زمان لازم برای شبیه‌سازی لودینگ
}

    let searchValue = "";
    const searchInput = document.getElementById("searchInput");

    searchInput.addEventListener("input", function () {
       searchValue = this.value.toLowerCase();
       rendertasks();   // یا rendertasks() اگر هنوز اسمش را تغییر نداده‌ای
    });

  </script>
</body>
